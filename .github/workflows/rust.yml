name: tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install nightly toolchain
      run: rustup toolchain install nightly --component clippy
    - name: Install llvm-tools-preview
      run: rustup component add llvm-tools-preview
    - uses: Swatinem/rust-cache@v2
    - uses: taiki-e/install-action@cargo-llvm-cov
    - name: Check formatting
      run: cargo fmt --verbose --check
    - name: Build all features
      run: cargo build --verbose --all-features
    - name: Build no default features
      run: cargo build --verbose --no-default-features
    - name: Run tests with coverage
      run: cargo llvm-cov --verbose --all-features --fail-under-lines 95
    - name: Run benches
      run: cargo +nightly bench --verbose
    - name: Check docs
      run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
    - name: Run lints
      run: cargo clippy --verbose --all-features -- -D warnings
    - name: Run bench lints
      run: cargo +nightly clippy --verbose --benches -- -D warnings

  automerge:
    needs: [build]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # dependabot-triggered runs get a read-only token unless a job asks for more
    permissions:
      contents: write
      pull-requests: write

    steps:
    - run: gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
